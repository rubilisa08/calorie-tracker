<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>칼로리 트래커</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <main>
    <!-- 인증 화면 -->
    <section id="auth-view">
      <h1>칼로리 트래커</h1>

      <form id="login-form" class="auth-form">
        <input id="login-email" type="email" placeholder="이메일" autocomplete="email" required />
        <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password" required />
        <button type="submit">로그인</button>
      </form>

      <form id="signup-form" class="auth-form" hidden>
        <input id="signup-email" type="email" placeholder="이메일" autocomplete="email" required />
        <input id="signup-password" type="password" placeholder="비밀번호 (8자 이상, 대/소문자·숫자·특수문자 포함)" autocomplete="new-password" required minlength="8" />
        <input id="signup-password-confirm" type="password" placeholder="비밀번호 확인" autocomplete="new-password" required minlength="8" />
        <button type="submit">회원가입</button>
      </form>

      <p id="auth-message" class="auth-message" hidden></p>

      <p class="auth-toggle">
        <a href="#" id="show-signup">계정이 없으신가요? 회원가입</a>
        <a href="#" id="show-login" hidden>이미 계정이 있으신가요? 로그인</a>
      </p>
    </section>

    <!-- 트래커 화면 -->
    <section id="tracker-view" hidden>
      <header class="tracker-header">
        <h1>칼로리 트래커</h1>
        <div class="header-right">
          <span id="user-email" class="user-email"></span>
          <button id="logout-btn" type="button">로그아웃</button>
        </div>
      </header>
      <p id="today-date" class="today-date"></p>

      <div class="goal-bar">
        <span id="goal-display" class="goal-display"></span>
        <button id="edit-goal-btn" type="button" class="link-btn">목표 수정</button>
        <button id="open-calendar-btn" type="button" class="link-btn">📅 캘린더</button>
      </div>
      <form id="goal-form" class="goal-form" hidden>
        <input id="goal-input" type="number" min="1" step="1" placeholder="하루 목표 칼로리 (kcal)" />
        <button type="submit">저장</button>
        <button type="button" id="cancel-goal-btn" class="secondary-btn">취소</button>
      </form>

      <div class="summary-grid">
        <div class="summary-card">
          <span class="summary-label">칼로리</span>
          <span class="summary-value"><span id="sum-calories">0</span> <span class="summary-unit">kcal</span></span>
        </div>
        <div class="summary-card">
          <span class="summary-label">탄수화물</span>
          <span class="summary-value"><span id="sum-carbs">0</span> <span class="summary-unit">g</span></span>
        </div>
        <div class="summary-card">
          <span class="summary-label">단백질</span>
          <span class="summary-value"><span id="sum-protein">0</span> <span class="summary-unit">g</span></span>
        </div>
        <div class="summary-card">
          <span class="summary-label">지방</span>
          <span class="summary-value"><span id="sum-fat">0</span> <span class="summary-unit">g</span></span>
        </div>
      </div>
      <p id="goal-remaining" class="goal-remaining" hidden></p>

      <div id="search-input-card" class="input-card">
        <input id="food-search" type="text" placeholder="음식 이름 검색 (예: 닭가슴살)" autocomplete="off" />
        <ul id="search-results" class="search-results"></ul>

        <div id="selected-food" class="selected-food" hidden>
          <p id="selected-food-name" class="selected-food-name"></p>
          <p id="selected-food-base" class="selected-food-base"></p>
          <label class="amount-label">
            섭취량
            <input id="amount-input" type="number" min="1" step="1" />
            g
          </label>
          <p id="preview" class="preview"></p>
          <button id="add-btn" type="button" disabled>기록에 추가</button>
        </div>

        <p class="manual-toggle">
          <a href="#" id="show-manual-entry">찾는 음식이 없나요? 직접 입력하기</a>
        </p>
      </div>

      <form id="manual-form" class="input-card manual-form" hidden>
        <p class="manual-form-title">음식 직접 입력</p>
        <input id="manual-name" type="text" placeholder="음식 이름 (예: 엄마표 김밥)" required />
        <input id="manual-calories" type="number" min="0" step="1" placeholder="칼로리 (kcal)" required />
        <div class="manual-optional-row">
          <input id="manual-carbs" type="number" min="0" step="0.1" placeholder="탄수화물 g (선택)" />
          <input id="manual-protein" type="number" min="0" step="0.1" placeholder="단백질 g (선택)" />
          <input id="manual-fat" type="number" min="0" step="0.1" placeholder="지방 g (선택)" />
        </div>
        <div class="manual-actions">
          <button type="submit" id="manual-add-btn">기록에 추가</button>
          <button type="button" id="manual-cancel-btn" class="secondary-btn">취소</button>
        </div>
      </form>

      <div class="log-section">
        <h2>오늘의 기록</h2>
        <ul id="log-list" class="log-list"></ul>
        <p id="log-empty" class="empty" hidden>오늘 기록된 음식이 없어요</p>
      </div>

      <p class="disclaimer">※ 영양성분은 일반적인 평균값 기준 추정치이며 실제와 다를 수 있습니다.</p>
    </section>

    <!-- 캘린더 화면 -->
    <section id="calendar-view" hidden>
      <header class="tracker-header">
        <button id="back-to-tracker-btn" type="button" class="link-btn">← 트래커로</button>
        <span id="calendar-goal-display" class="goal-display"></span>
      </header>

      <div class="calendar-nav">
        <button id="prev-month-btn" type="button" class="secondary-btn">◀</button>
        <span id="calendar-title" class="calendar-title"></span>
        <button id="next-month-btn" type="button" class="secondary-btn">▶</button>
      </div>

      <div class="calendar-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>

      <div id="day-detail" class="day-detail" hidden>
        <p id="day-detail-title" class="day-detail-title"></p>
        <ul id="day-detail-list" class="log-list"></ul>
        <p id="day-detail-empty" class="empty" hidden>이 날은 기록이 없어요</p>
      </div>
    </section>
  </main>

  <!-- Supabase JS 라이브러리 (CDN, 빌드 도구 불필요) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js?v=1"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
